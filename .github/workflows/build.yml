name: Build with Watcom wasm and wlink
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: open-watcom/setup-watcom@v1
      with:
        version: "2.0"
        target:  "dos"
    - run: |
        wmake -h -u -f Makefile.wat
        make -f Makefile.wat clean
        make -f Makefile.wat
    - name: The driver file
        uses: actions/upload-artifact@v4
        with:
          path: 3c509.com
    - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 
          path: |
            *.asm
            MAKEFILE
            Makefile.wat
            README.md
            README.md.d
            
